name: Build PDFs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build pinned container
        run: docker build --platform linux/amd64 --build-arg BENX_UID="$(id -u)" --build-arg BENX_GID="$(id -g)" -t benx-build .
      - name: Build and inspect PDF editions
        run: |
          for edition in lite developer advanced; do
            docker run --rm --platform linux/amd64 -v "$PWD:/source" benx-build "$edition"
          done
      - name: Test terminal
        run: make test
      - name: Boot the bundled VM and test guest writes
        run: |
          PYTHONPATH=.cache/downloads/pdfrw-0.4-py2.py3-none-any.whl \
            python3 tests/check_pdf.py out/BenX_Lite.pdf Lite 32 build/lite-test.js
          node tests/session.cjs build/lite-test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BenX-pdf-editions
          path: |
            out/BenX_*.pdf
            out/BenX_*.pdf.sha256
          if-no-files-found: error
